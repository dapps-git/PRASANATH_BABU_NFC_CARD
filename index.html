<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PRASANTH BABU | Founder &amp; CEO - SILVERWINGS HOTEL CONSULTANCY</title>

  <!-- Meta tags for sharing & mobile -->
  <meta name="title" content="PRASANTH BABU - Founder &amp; CEO | Silverwings Hotel Consultancy">
  <meta name="description"
    content="Digital Business Card of Prasanth Babu, Founder &amp; CEO at Silverwings Hotel Consultancy. Connect via Phone, Email, Website, Address, Instagram, and Facebook.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/silverwings-blue-logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Full Viewport Mobile Card Container (Strictly 1 view, 0 scroll, 0 slide) -->
  <main class="card-wrapper" id="cardContainer">

    <!-- Top Header: Silverwings Blue Logo -->
    <header class="header-section">
      <img src="assets/silverwings-blue-logo.png" alt="Silverwings Hotel Consultancy" class="brand-logo">
    </header>

    <!-- Circular Profile Photo (Clean, no border, generous size) -->
    <div class="avatar-section">
      <div class="avatar-container">
        <img src="assets/profile.jpg" alt="Prasanth Babu" class="avatar-img">
      </div>
    </div>

    <!-- Identity: Name & Executive Title -->
    <div class="identity-section">
      <h1 class="person-name">PRASANTH BABU</h1>
      <div class="person-title-wrap">
        <span class="gold-line"></span>
        <span class="person-title">Founder &amp; CEO</span>
        <span class="gold-line"></span>
      </div>
      <div class="person-company">SILVERWINGS HOTEL CONSULTANCY</div>
    </div>

    <!-- Contact & Social Cards (Navy Blue Icons, Reduced Gaps, Sharp 6px Border Radius) -->
    <div class="links-section">

      <!-- 1. Phone Card -->
      <div class="contact-card" role="button" tabindex="0" onclick="handleCardClick('tel:+919446443221')">
        <div class="card-icon-col">
          <svg class="brand-blue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
            </path>
          </svg>
        </div>
        <div class="card-content-col single-line">
          <span class="card-primary-text">+91 9446 443221</span>
        </div>
        <button class="card-action-btn" title="Copy Phone Number"
          onclick="copyText(event, '+919446443221', 'Phone number copied!')" aria-label="Copy phone number">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>

      <!-- 2. Website Card (Placed immediately after Mobile Number) -->
      <a class="contact-card" href="https://www.silverwingsideas.com" target="_blank" rel="noopener noreferrer">
        <div class="card-icon-col">
          <svg class="brand-blue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <div class="card-content-col single-line">
          <span class="card-primary-text">www.silverwingsideas.com</span>
        </div>
        <div class="card-action-btn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </div>
      </a>

      <!-- 3. Email Card (Placed after Website) -->
      <div class="contact-card" role="button" tabindex="0"
        onclick="handleCardClick('mailto:silverwingsideas@gmail.com')">
        <div class="card-icon-col">
          <svg class="brand-blue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </div>
        <div class="card-content-col single-line">
          <span class="card-primary-text">silverwingsideas@gmail.com</span>
        </div>
        <button class="card-action-btn" title="Copy Email Address"
          onclick="copyText(event, 'silverwingsideas@gmail.com', 'Email copied!')" aria-label="Copy email address">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>

      <!-- 4. Office Address Card (Direct address, no 'Office Address' label) -->
      <a class="contact-card address-card"
        href="https://maps.google.com/?q=Chowallur+Tower,+Westfort,+Thrissur,+Kerala+680004" target="_blank"
        rel="noopener noreferrer">
        <div class="card-icon-col">
          <svg class="brand-blue-icon" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd"
              d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 00-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 002.682 2.282 16.975 16.975 0 001.145.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z"
              clip-rule="evenodd" />
          </svg>
        </div>
        <div class="card-content-col address-content">
          <span class="card-address-line1">Chowallur Tower, 5th Floor</span>
          <span class="card-address-line2">Westfort, Thrissur – 680004, Kerala, India</span>
        </div>
        <div class="card-action-btn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </div>
      </a>

      <!-- 5. Instagram Card (Clean: only 'Instagram', URL hidden) -->
      <a class="contact-card" href="https://www.instagram.com/silverwings_ideas/" target="_blank"
        rel="noopener noreferrer">
        <div class="card-icon-col">
          <svg class="brand-blue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </div>
        <div class="card-content-col single-line">
          <span class="card-primary-text">Instagram</span>
        </div>
        <div class="card-action-btn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </div>
      </a>

      <!-- 6. Facebook Card (Clean: only 'Facebook', URL hidden) -->
      <a class="contact-card" href="https://www.facebook.com/share/18bddLjtPb/" target="_blank"
        rel="noopener noreferrer">
        <div class="card-icon-col">
          <svg class="brand-blue-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
        </div>
        <div class="card-content-col single-line">
          <span class="card-primary-text">Facebook</span>
        </div>
        <div class="card-action-btn" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </div>
      </a>

    </div>

    <!-- Bottom Dark Blue Brand Footer Section (Silver Wings Logo & Motif) -->
    <footer class="bottom-brand-footer">
      <img src="assets/white-logo-transparent.png" alt="Silver Wings Hospitality Dining Solutions"
        class="footer-brand-logo">
    </footer>

  </main>

  <!-- Interactive Toast Notification -->
  <div id="toast" class="toast-message" role="alert" aria-live="polite"></div>

  <script src="script.js"></script>
</body>

</html>
